<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Bellcast</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #000;
        --panel: #09090b;
        --line: rgba(255, 255, 255, 0.1);
        --muted: #71717a;
        --text: #f4f4f5;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        background:
          radial-gradient(ellipse at top, rgba(255, 255, 255, 0.07), transparent 60%),
          linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          var(--bg);
        background-size: auto, 64px 64px, 64px 64px, auto;
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      main {
        width: 100%;
        max-width: 430px;
      }

      .brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        margin-bottom: 26px;
      }

      .mark {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 48px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.04);
        box-shadow: 0 0 40px rgba(255, 255, 255, 0.06);
      }

      h1 {
        margin: 16px 0 0;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .sub {
        margin: 6px 0 0;
        font-size: 13px;
        color: var(--muted);
      }

      .card {
        border: 1px solid var(--line);
        border-radius: 16px;
        background: rgba(9, 9, 11, 0.85);
        padding: 22px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.02em;
        color: #a1a1aa;
      }

      .field + .field {
        margin-top: 16px;
      }

      input {
        width: 100%;
        height: 40px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: #000;
        color: var(--text);
        font: inherit;
        font-size: 13px;
        outline: none;
        transition: border-color 120ms ease, box-shadow 120ms ease;
      }

      input::placeholder {
        color: #3f3f46;
      }

      input:focus {
        border-color: rgba(255, 255, 255, 0.28);
        box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.07);
      }

      .mono {
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 12px;
      }

      button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        height: 40px;
        margin-top: 20px;
        border: 0;
        border-radius: 9px;
        background: #fff;
        color: #000;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background 120ms ease, opacity 120ms ease;
      }

      button:hover:not(:disabled) {
        background: #e4e4e7;
      }

      button:disabled {
        cursor: default;
        opacity: 0.55;
      }

      .spinner {
        width: 14px;
        height: 14px;
        border: 2px solid rgba(0, 0, 0, 0.22);
        border-top-color: #000;
        border-radius: 50%;
        animation: spin 700ms linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .status {
        display: none;
        margin-top: 14px;
        padding: 9px 11px;
        border: 1px solid rgba(248, 113, 113, 0.22);
        border-radius: 8px;
        background: rgba(248, 113, 113, 0.08);
        font-size: 12px;
        line-height: 1.5;
        color: #fca5a5;
      }

      .status.visible {
        display: block;
      }

      .hint {
        margin: 14px 0 0;
        text-align: center;
        font-size: 11px;
        line-height: 1.6;
        color: #52525b;
      }

      .hint code {
        color: #a1a1aa;
      }

      footer {
        margin-top: 18px;
        text-align: center;
        font-size: 11px;
        color: #3f3f46;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <div class="mark" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
            <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
          </svg>
        </div>
        <h1>Bellcast</h1>
        <p class="sub">Connect this app to your self-hosted instance.</p>
      </div>

      <form class="card" id="form" autocomplete="off">
        <div class="field">
          <label for="url">Instance URL</label>
          <input id="url" name="url" type="url" placeholder="https://your-instance.vercel.app" spellcheck="false" required />
        </div>

        <div class="field">
          <label for="key">API key</label>
          <input id="key" name="key" type="password" class="mono" placeholder="Paste your instance API key" spellcheck="false" required />
        </div>

        <button id="submit" type="submit">Connect</button>
        <div class="status" id="status" role="alert"></div>

        <p class="hint">
          The key is stored in <code>~/.config/app.bellcast.desktop/config.json</code>
          with owner-only permissions. Start at login is enabled automatically.
        </p>
      </form>

      <footer>Bellcast Desktop 0.1.0</footer>
    </main>

    <script>
      const form = document.getElementById("form");
      const urlInput = document.getElementById("url");
      const keyInput = document.getElementById("key");
      const submit = document.getElementById("submit");
      const status = document.getElementById("status");
      const invoke = window.__TAURI__.core.invoke;

      function setStatus(message) {
        status.textContent = message || "";
        status.classList.toggle("visible", Boolean(message));
      }

      function setBusy(busy, label) {
        submit.disabled = busy;
        submit.innerHTML = busy
          ? '<span class="spinner"></span>' + (label || "Connecting…")
          : "Connect";
      }

      window.addEventListener("DOMContentLoaded", async () => {
        try {
          const config = await invoke("get_config");
          if (config.instance_url) urlInput.value = config.instance_url;
          if (config.has_key) submit.textContent = "Reconnect";
        } catch (error) {
          setStatus(String(error));
        }
        urlInput.focus();
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        setStatus("");
        setBusy(true, "Checking instance…");

        try {
          await invoke("save_config", {
            instanceUrl: urlInput.value,
            apiKey: keyInput.value,
          });
        } catch (error) {
          setBusy(false);
          setStatus(typeof error === "string" ? error : String(error));
        }
      });
    </script>
  </body>
</html>
